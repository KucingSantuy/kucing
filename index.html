<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>meow for adik</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="game-wrapper">
    <canvas id="c"></canvas>

    <div id="top-bar">
      <button id="name-tag-btn" class="top-btn" title="Ganti Nama Kucing">
        <canvas id="name-paw-cvs" width="8" height="6"
          style="image-rendering:pixelated; width:12px; height:9px; display:block;"></canvas>
        <span id="cat-name-display">Mochi</span>
      </button>
      <button id="mute-btn" class="top-btn" title="Toggle Sound">
        <canvas id="mute-canvas" width="10" height="9"
          style="image-rendering:pixelated; width:13px; height:11px; display:block;"></canvas>
        <span id="mute-text">Sound</span>
      </button>
    </div>

    <div id="speech-bubble">
      <span id="bubble-text"></span>
    </div>

    <div id="easter-banner">
      <span id="banner-text">good luck, dik</span>
      <canvas id="banner-heart-cvs" width="9" height="8"
        style="image-rendering:pixelated; width:12px; height:10px; vertical-align:middle; margin-left:4px; display:inline-block;"></canvas>
    </div>

    <div id="toolbar">
      <button class="tool-btn active" data-tool="pet" id="btn-pet">
        <canvas class="btn-canvas" id="icon-pet" width="12" height="12"></canvas>
        <span class="tool-label">Belai</span>
      </button>
      <button class="tool-btn" data-tool="flowers" id="btn-flowers">
        <canvas class="btn-canvas" id="icon-flowers" width="12" height="12"></canvas>
        <span class="tool-label">Bunga</span>
      </button>
      <button class="tool-btn" data-tool="snack" id="btn-snack">
        <canvas class="btn-canvas" id="icon-snack" width="12" height="12"></canvas>
        <span class="tool-label">Snack</span>
      </button>
      <button class="tool-btn" data-tool="yarn" id="btn-yarn">
        <canvas class="btn-canvas" id="icon-yarn" width="12" height="12"></canvas>
        <span class="tool-label">Mainan</span>
      </button>
      <button class="tool-btn" data-tool="brush" id="btn-brush">
        <canvas class="btn-canvas" id="icon-brush" width="12" height="12"></canvas>
        <span class="tool-label">Sisir</span>
      </button>
      <button class="tool-btn" data-tool="blanket" id="btn-blanket">
        <canvas class="btn-canvas" id="icon-blanket" width="12" height="12"></canvas>
        <span class="tool-label">Selimut</span>
      </button>
    </div>
  </div>

  <div id="name-modal" class="hidden">
    <div class="modal-box">
      <div class="modal-title">Beri Nama Kucing</div>
      <input type="text" id="name-input" class="modal-input" maxlength="12" placeholder="Nama kucing..."
        autocomplete="off">
      <div class="modal-actions">
        <button id="name-cancel-btn" class="modal-btn">Batal</button>
        <button id="name-save-btn" class="modal-btn primary">Simpan</button>
      </div>
    </div>
  </div>

  <script src="sprites.js"></script>
  <script src="script.js"></script>
</body>

</html>
